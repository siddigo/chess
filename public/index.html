<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xadrez às Cegas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">♞ Xadrez às Cegas</a>
    <nav><a href="/" class="active">Jogar</a><a href="/history">Histórico</a></nav>
  </header>

  <main>
    <div class="row" style="align-items:flex-start">
      <section class="card" style="flex:2 1 420px">
        <h2>Criar desafio</h2>
        <form id="create">
          <label><span>Seu nome</span><input type="text" name="name" maxlength="24" required></label>

          <div class="field-head">
            <span id="level-label">Nível de visualização</span>
            <button type="button" class="pill" id="custom-toggle" aria-pressed="false">Personalizado</button>
          </div>
          <div class="levels" id="levels"></div>

          <div id="opp-levels-wrap" class="hidden">
            <label style="margin-top:16px"><span>Nível de visualização do adversário</span></label>
            <div class="levels" id="opp-levels"></div>
          </div>
          <p class="muted" style="font-size:13px;margin:8px 0 0" id="level-hint"></p>

          <div class="row" style="margin-top:16px">
            <label><span>Jogar de</span>
              <select name="color">
                <option value="random">Aleatório</option>
                <option value="white">Brancas</option>
                <option value="black">Pretas</option>
              </select>
            </label>
            <label><span id="tc-label">Ritmo</span><select name="tc"></select></label>
            <label class="hidden" id="opp-tc-wrap"><span>Ritmo do adversário</span><select name="oppTc"></select></label>
          </div>
          <div class="row hidden" id="custom-tc">
            <label><span id="minutes-label">Minutos</span><input type="number" name="minutes" min="0.5" max="180" step="0.5" value="10"></label>
            <label><span id="increment-label">Incremento (s)</span><input type="number" name="increment" min="0" max="60" value="0"></label>
          </div>
          <div class="row hidden" id="opp-custom-tc">
            <label><span>Minutos do adversário</span><input type="number" name="oppMinutes" min="0.5" max="180" step="0.5" value="10"></label>
            <label><span>Incremento do adversário (s)</span><input type="number" name="oppIncrement" min="0" max="60" value="0"></label>
          </div>
          <button class="primary" type="submit" style="width:100%;margin-top:6px">Criar partida</button>
        </form>
      </section>

      <section style="flex:1 1 300px">
        <div class="card">
          <h2>Aguardando oponente</h2>
          <div id="open" class="muted">Carregando…</div>
        </div>
        <div class="card">
          <h2>Em andamento</h2>
          <div id="playing" class="muted">Carregando…</div>
        </div>
      </section>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module">
    import { LEVEL_NAMES, getPref, setPref, timeControlText, escapeHtml } from '/board.js';
    import { api, getSeat, saveSeat, subscribeLobby } from '/net.js';

    const form = document.getElementById('create');
    form.name.value = getPref('name', '');

    const levelPicker = (name, saved) => LEVEL_NAMES.map((n, i) => `
      <label><input type="radio" name="${name}" value="${i}" ${i === saved ? 'checked' : ''}>
        <b>${i}</b><small>${n}</small></label>`).join('');
    document.getElementById('levels').innerHTML = levelPicker('level', getPref('level', 0));
    document.getElementById('opp-levels').innerHTML = levelPicker('opponentLevel', getPref('opponentLevel', 0));

    const TC_PRESETS = ['1+0', '3+0', '3+2', '5+0', '5+3', '10+0', '10+5', '15+10', '30+0'];
    const tcOptions = `<option value="">Sem relógio</option>`
      + TC_PRESETS.map((t) => `<option value="${t}">${t}</option>`).join('')
      + `<option value="custom">Personalizado…</option>`;
    form.tc.innerHTML = form.oppTc.innerHTML = tcOptions;
    form.tc.value = form.oppTc.value = '10+0';

    // Modo simples: um nível e um ritmo para os dois. "Personalizado": cada jogador tem os seus.
    const toggle = document.getElementById('custom-toggle');
    let custom = getPref('customSetup', false);
    function updateForm() {
      toggle.setAttribute('aria-pressed', custom);
      document.getElementById('level-label').textContent = custom ? 'Seu nível de visualização' : 'Nível de visualização';
      document.getElementById('tc-label').textContent = custom ? 'Seu ritmo' : 'Ritmo';
      document.getElementById('minutes-label').textContent = custom ? 'Seus minutos' : 'Minutos';
      document.getElementById('increment-label').textContent = custom ? 'Seu incremento (s)' : 'Incremento (s)';
      document.getElementById('level-hint').textContent = custom
        ? 'Os níveis e ritmos não podem ser alterados depois. Seu amigo vê essa configuração antes de aceitar.'
        : 'Vale para os dois jogadores e não pode ser alterado depois.';
      document.getElementById('opp-levels-wrap').classList.toggle('hidden', !custom);
      document.getElementById('opp-tc-wrap').classList.toggle('hidden', !custom);
      document.getElementById('custom-tc').classList.toggle('hidden', form.tc.value !== 'custom');
      document.getElementById('opp-custom-tc').classList.toggle('hidden', !custom || form.oppTc.value !== 'custom');
    }
    toggle.addEventListener('click', () => { custom = !custom; updateForm(); });
    form.tc.addEventListener('change', updateForm);
    form.oppTc.addEventListener('change', updateForm);
    updateForm();

    function readTc(value, minutes, increment) {
      if (value === 'custom') return { minutes: +minutes, increment: +increment };
      if (!value) return null;
      const [m, i] = value.split('+').map(Number);
      return { minutes: m, increment: i };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const level = Number(form.level.value);
      const opponentLevel = custom ? Number(form.opponentLevel.value) : level;
      const timeControl = readTc(form.tc.value, form.minutes.value, form.increment.value);
      const opponentTimeControl = custom ? readTc(form.oppTc.value, form.oppMinutes.value, form.oppIncrement.value) : timeControl;
      if (!timeControl !== !opponentTimeControl) {
        alert('Os dois jogadores precisam ter relógio, ou nenhum.');
        return;
      }
      setPref('name', form.name.value.trim());
      setPref('level', level);
      setPref('opponentLevel', opponentLevel);
      setPref('customSetup', custom);
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const { id, token, color } = await api('games', {
          method: 'POST',
          body: { name: form.name.value, level, opponentLevel, color: form.color.value, timeControl, opponentTimeControl },
        });
        saveSeat(id, token, color);
        location.href = '/game/' + id;
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });

    function mine(id) { return !!getSeat(id); }

    function playerCell(p) {
      return p ? `${escapeHtml(p.name)} <span class="badge" title="Nível de visualização">${p.level}</span>` : '<span class="muted">—</span>';
    }

    async function refresh() {
      let games;
      try { games = await api('games'); } catch { return; }
      const dayAgo = Date.now() - 24 * 3600_000;
      const open = games.filter((g) => g.status === 'waiting' && g.createdAt > dayAgo);
      const playing = games.filter((g) => g.status === 'playing');

      document.getElementById('open').innerHTML = open.length ? `<table>${open.map((g) => {
        const host = g.white ?? g.black;
        return `<tr class="clickable" data-id="${g.id}">
          <td>${playerCell(host)}<br><small class="muted">${timeControlText(g.timeControl)} · ${g.white ? 'brancas' : 'pretas'}${g.openSeat?.level != null ? ` · você jogaria no nível ${g.openSeat.level}` : ''}</small></td>
          <td style="text-align:right">${mine(g.id) ? '<span class="muted">sua</span>' : '<span class="btn small primary">Aceitar</span>'}</td>
        </tr>`;
      }).join('')}</table>` : '<p class="muted">Nenhum desafio aberto. Crie um e mande o link para um amigo.</p>';

      document.getElementById('playing').innerHTML = playing.length ? `<table>${playing.map((g) => `
        <tr class="clickable" data-id="${g.id}">
          <td>${playerCell(g.white)}<br>${playerCell(g.black)}</td>
          <td style="text-align:right">${mine(g.id) ? '<span class="btn small primary">Voltar</span>' : '<span class="muted">assistir</span>'}</td>
        </tr>`).join('')}</table>` : '<p class="muted">Nenhuma partida em andamento.</p>';

      document.querySelectorAll('tr[data-id]').forEach((tr) =>
        tr.addEventListener('click', () => (location.href = '/game/' + tr.dataset.id)));
    }

    subscribeLobby(refresh);
  </script>
</body>
</html>
