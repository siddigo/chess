<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico · Xadrez às Cegas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">♞ Xadrez às Cegas</a>
    <nav><a href="/">Jogar</a><a href="/ao-vivo">Ao vivo</a><a href="/history" class="active">Histórico</a></nav>
  </header>

  <main>
    <section class="card">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <h2 style="margin:0;flex:1">Histórico de partidas</h2>
        <input type="text" id="filter" placeholder="Filtrar por jogador…" style="max-width:240px">
      </div>
      <div id="stats" class="muted" style="margin-bottom:12px"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Data</th><th>Brancas</th><th>Pretas</th><th>Resultado</th><th>Motivo</th><th>Lances</th><th>Ritmo</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="muted">Carregando…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { resultText, timeControlText, escapeHtml, getPref, setPref } from '/board.js';
    import { api } from '/net.js';

    let games = [];

    const fmtDate = (ms) => new Date(ms).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const player = (p, won) => p
      ? `<span style="${won ? 'font-weight:700' : ''}">${escapeHtml(p.name)}</span> <span class="badge" title="Nível de visualização">${p.level}</span>`
      : '—';

    function render() {
      const q = document.getElementById('filter').value.trim().toLowerCase();
      const list = games.filter((g) => !q || [g.white?.name, g.black?.name].some((n) => n?.toLowerCase().includes(q)));

      if (q) {
        let w = 0, d = 0, l = 0;
        for (const g of list) {
          const color = g.white?.name.toLowerCase().includes(q) ? '1-0' : '0-1';
          if (g.result === '1/2-1/2') d++;
          else if (g.result === color) w++;
          else if (g.result === '1-0' || g.result === '0-1') l++;
        }
        document.getElementById('stats').textContent = `${list.length} partida(s) · ${w} vitória(s), ${d} empate(s), ${l} derrota(s)`;
      } else {
        document.getElementById('stats').textContent = `${list.length} partida(s) encerrada(s)`;
      }

      document.getElementById('rows').innerHTML = list.length ? list.map((g) => `
        <tr class="clickable" data-id="${g.id}">
          <td>${fmtDate(g.finishedAt ?? g.createdAt)}</td>
          <td>${player(g.white, g.result === '1-0')}</td>
          <td>${player(g.black, g.result === '0-1')}</td>
          <td><b>${resultText(g.result)}</b></td>
          <td class="muted">${escapeHtml(g.termination ?? '')}</td>
          <td>${Math.ceil(g.moveCount / 2)}</td>
          <td class="muted">${timeControlText(g.timeControl)}</td>
          <td style="white-space:nowrap">
            <a class="btn small" href="/api/games/${g.id}/pgn?download" onclick="event.stopPropagation()">PGN</a>
            <button class="small" data-del="${g.id}" title="Apagar">✕</button>
          </td>
        </tr>`).join('') : '<tr><td colspan="8" class="muted">Nenhuma partida encontrada.</td></tr>';

      document.querySelectorAll('tr[data-id]').forEach((tr) =>
        tr.addEventListener('click', () => (location.href = '/replay/' + tr.dataset.id)));
      document.querySelectorAll('[data-del]').forEach((b) =>
        b.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Apagar esta partida do histórico?')) return;
          let password = getPref('adminPassword', '');
          if (!password) password = prompt('Senha de administrador:') ?? '';
          try {
            await api('games/' + b.dataset.del, { method: 'DELETE', headers: { 'x-admin-password': password } });
            setPref('adminPassword', password);
          } catch (err) {
            if (err.status === 401) setPref('adminPassword', '');
            alert(err.message);
          }
          load();
        }));
    }

    async function load() {
      games = (await api('games')).filter((g) => g.status === 'finished');
      render();
    }

    document.getElementById('filter').addEventListener('input', render);
    load();
  </script>
</body>
</html>
